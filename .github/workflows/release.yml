name: release

on:
  workflow_dispatch:
    inputs:
      release-version:
        description: 'Version being released'
        required: true
      branch:
        description: 'Branch to release from'
        required: true
        default: 'main'

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          java-version: 11
          distribution: 'temurin'
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_CENTRAL_TOKEN
          gpg-private-key: ${{ secrets.java_gpg_secret_key }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - id: install-secret-key
        name: Install gpg secret key
        run: |
          cat <(echo -e "${{ secrets.java_gpg_secret_key }}") | gpg --batch --import
          gpg --list-secret-keys --keyid-format LONG

      - name: Compile
        run: mvn --batch-mode clean install -DskipTests

      - name: Install ORAS
        uses: oras-project/setup-oras@v2

      # Retags the digest CI tested; no Rust toolchain needed.
      - name: Publish the Javy plugin wasm under the release version
        run: |
          set -euo pipefail
          DIGEST=$(grep -oE 'sha256:[0-9a-f]{64}' wkg.lock | head -1 || true)
          if [ -z "$DIGEST" ]; then
            echo "::error::No digest found in wkg.lock"
            exit 1
          fi
          echo "Retagging $DIGEST as $VERSION"
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u ${{ github.actor }} --password-stdin
          oras tag "ghcr.io/roastedroot/quickjs4j-javy-plugin@${DIGEST}" "$VERSION"
        env:
          VERSION: ${{ github.event.inputs.release-version }}

      # Before "Set the version", so its `git add .` picks these up.
      - name: Pin the build to the released wasm
        run: |
          mvn versions:set-property -Dproperty=javy-plugin.version \
              -DnewVersion=${{ github.event.inputs.release-version }} -DgenerateBackupPoms=false
          mvn --batch-mode generate-sources -pl core -Dinlay.update

      # Jars built against a mutable tag could not be rebuilt later.
      - name: Verify the Javy plugin wasm tag is immutable
        run: |
          set -euo pipefail
          v=$(mvn help:evaluate -Dexpression=javy-plugin.version -q -DforceStdout)
          echo "javy-plugin.version = $v"
          case "$v" in
            *SNAPSHOT*)
              echo "::error::Refusing to release jars built against the mutable wasm tag '$v'"
              exit 1
              ;;
          esac

      - name: Setup Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Set the version
        run: |
          mvn versions:set -DgenerateBackupPoms=false -DnewVersion=${{ github.event.inputs.release-version }}
          git add .
          git commit -m "Release version update ${{ github.event.inputs.release-version }}"
          git push
          git tag ${{ github.event.inputs.release-version }}
          git push origin ${{ github.event.inputs.release-version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release to Maven Central
        run: |
          mvn --batch-mode deploy -Prelease -DskipTests=true
        env:
          MAVEN_USERNAME: ${{ secrets.central_username }}
          MAVEN_CENTRAL_TOKEN: ${{ secrets.central_password }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.java_gpg_passphrase }}

      - name: Back to Snapshot
        run: |
          mvn versions:set -DgenerateBackupPoms=false -DnewVersion=999-SNAPSHOT
          mvn versions:set-property -Dproperty=javy-plugin.version \
              -DnewVersion=999.0.0-SNAPSHOT -DgenerateBackupPoms=false
          mvn --batch-mode generate-sources -pl core -Dinlay.update
          git add .
          git commit -m "Snapshot version update"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
